services:
  mysql57:
    image: mysql:8.0.29
    restart: unless-stopped
    container_name: db
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: market_management
      TZ: America/Sao_Paulo
    volumes:
      - ./db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercado_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    container_name: backend
    ports:
      - "5000:5000"
    volumes:
      - .:/src
    environment:
      FLASK_APP: run.py
      FLASK_ENV: development
      TZ: America/Sao_Paulo
    depends_on:
      mysql57:
        condition: service_healthy
    networks:
      - mercado_network

networks:
  mercado_network:
    name: mercado_network
    driver: bridge